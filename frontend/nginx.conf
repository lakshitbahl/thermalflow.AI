# Served by nginx:alpine, which runs envsubst over this template at startup,
# substituting ${BFF_HOST}/${BFF_PORT} (defaulted in Dockerfile.spa to bff:8080
# for compose; set BFF_HOST=bff in k8s so the name resolves there too).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── REST API → BFF ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://${BFF_HOST}:${BFF_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket → BFF ──────────────────────────────────────────
    location /ws {
        proxy_pass http://${BFF_HOST}:${BFF_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSockets are long-lived; don't let nginx time them out at 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA (history-API fallback) ───────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
